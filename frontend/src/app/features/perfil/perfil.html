<div class="min-h-screen w-full flex flex-col bg-bg select-none pb-8">

  <app-toolbar [titulo]="'Mi Perfil'" [mostrarBotonMenu]="true" (menuClick)="menuAbierto.set(true)"></app-toolbar>

  <div class="flex flex-col gap-6 p-5 max-w-md mx-auto w-full">

    <!-- Resumen de la cuenta -->
    <card class="flex flex-col items-center text-center py-8">

      <h3 class="text-lg font-bold text-text break-all px-2">
        {{ correo }}
      </h3>
      <span class="mt-3 inline-block rounded-full bg-success-bg px-3 py-1 text-xs font-semibold text-success">
        Funcionario municipal activo
      </span>
    </card>

    <!-- Información de la cuenta -->
    <card class="block">
      <h3 class="text-base font-bold text-text mb-4">
        Información de la cuenta
      </h3>
      <div class="flex flex-col gap-4 text-sm">
        <div class="flex items-center justify-between gap-4">
          <span class="text-text-muted">Correo electrónico</span>
          <span class="font-medium text-text text-right break-all">{{ correo }}</span>
        </div>
        <div class="flex items-center justify-between gap-4">
          <span class="text-text-muted">Tipo de cuenta</span>
          <span class="font-medium text-text">Funcionario municipal</span>
        </div>
      </div>
    </card>

    <!-- Preferencias -->
    <card class="block">
      <h3 class="text-base font-bold text-text mb-4">
        Preferencias
      </h3>
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary-soft text-primary">
            <mat-icon class="!text-xl !h-5 !w-5">{{ iconoTema }}</mat-icon>
          </div>
          <span class="text-sm font-semibold text-text">{{ etiquetaTema }}</span>
        </div>

        <button
          type="button"
          role="switch"
          [attr.aria-checked]="temaOscuroActivo"
          (click)="alternarTema()"
          class="relative inline-flex h-7 w-12 shrink-0 items-center rounded-full transition-colors duration-200"
          [class.bg-primary]="temaOscuroActivo"
          [class.bg-border]="!temaOscuroActivo"
          aria-label="Alternar modo oscuro">
          <span
            class="inline-block h-5 w-5 transform rounded-full bg-white shadow-md transition-transform duration-200"
            [class.translate-x-6]="temaOscuroActivo"
            [class.translate-x-1]="!temaOscuroActivo">
          </span>
        </button>
      </div>

      <div class="mt-4 flex items-center justify-between gap-4 border-t border-border pt-4">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary-soft text-primary">
            <mat-icon class="!text-xl !h-5 !w-5">my_location</mat-icon>
          </div>
          <span class="text-sm font-semibold text-text">Compartir mi ubicación</span>
        </div>

        <button
          type="button"
          role="switch"
          [attr.aria-checked]="ubicacionService.compartirUbicacion()"
          (click)="alternarUbicacion()"
          class="relative inline-flex h-7 w-12 shrink-0 items-center rounded-full transition-colors duration-200"
          [class.bg-primary]="ubicacionService.compartirUbicacion()"
          [class.bg-border]="!ubicacionService.compartirUbicacion()"
          aria-label="Alternar compartir ubicación">
          <span
            class="inline-block h-5 w-5 transform rounded-full bg-white shadow-md transition-transform duration-200"
            [class.translate-x-6]="ubicacionService.compartirUbicacion()"
            [class.translate-x-1]="!ubicacionService.compartirUbicacion()">
          </span>
        </button>
      </div>
    </card>

    <app-button variant="danger" (btnClick)="cerrarSesion()">
      Cerrar sesión
    </app-button>

  </div>

  <app-navigation-drawer [abierto]="menuAbierto()" (cerrado)="menuAbierto.set(false)"></app-navigation-drawer>
</div>
