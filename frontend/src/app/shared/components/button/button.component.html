<button 
  [type]="type"
  [disabled]="disabled || cargando"
  (click)="onClick()"
  [class]="'flex w-full items-center justify-center gap-2 rounded-lg px-4 py-3 text-sm font-semibold transition-all duration-200 box-border ' +
           getVariantClasses() +
           ' disabled:opacity-60 disabled:cursor-not-allowed disabled:bg-surface-alt disabled:text-text-muted'"
>
  @if (cargando) {
    <svg class="h-4 w-4 animate-spin text-current" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <span>Procesando...</span>
  } @else {
    <ng-content></ng-content>
  }
</button>
